<style>

:root[data-theme="dark"]{--bg:#161b13;--card:#1f261b;--ink:#e9ecdf;--mut:#9aa38c;--line:#333c2c;--g:#9cc77a;--gl:#2a3822;--r:#e58a7e;--rl:#3d211d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:18px 14px 40px}
h1{font:800 26px/1.15 Bitter,Georgia,serif;margin:0}h1 small{display:block;font:500 13px 'Be Vietnam Pro',sans-serif;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.tabs{display:flex;gap:6px;margin:16px 0;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;color:var(--mut);font:600 14px inherit;font-family:inherit;padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--g);border-color:var(--g)}
.yrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.y{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}.y b{display:block;font:800 17px Bitter,serif;color:var(--g)}.y span{font-size:12px;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
#q{flex:1 1 240px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:820px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);background:var(--gl);position:sticky;top:0}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--gl)}
td.n{text-align:right;font-variant-numeric:tabular-nums}.no{color:var(--line)}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--rl);color:var(--r);margin-left:6px}
.a{display:inline-block;width:22px;text-align:center;border-radius:4px;background:var(--gl);color:var(--g);font-weight:600;font-size:12px}
.det{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--g);border-radius:6px;padding:14px 16px;margin-bottom:14px}
.det h2{font:800 20px Bitter,serif;margin:0 0 6px}.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:10px 0}
.kv div span{display:block;font-size:12px;color:var(--mut)}
.hist{width:100%;min-width:0}.hist td,.hist th{white-space:normal}
.hero{background:var(--g);color:#fff;border-radius:8px;padding:18px 20px;margin-bottom:14px}
.hero h2{font:800 20px Bitter,serif;margin:0 0 4px}.hero p{margin:4px 0;opacity:.92}
.big{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px}.big b{font:800 28px Bitter,serif;display:block}.big span{font-size:12px;opacity:.85}
.pill{display:inline-block;padding:2px 9px;border-radius:9px;background:var(--gl);color:var(--g);font-weight:600;font-size:13px}
.tl{margin:0 0 14px;padding:0;list-style:none;border-left:3px solid var(--r)}.tl li{padding:2px 0 8px 14px}.tl b{color:var(--r)}
.gate{max-width:460px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--g);border-radius:8px;padding:22px;text-align:center}.gate h2{font:800 20px Bitter,serif;margin:0 0 8px}.gate p{color:var(--mut)}.gate button,.ok{font:600 14px inherit;font-family:inherit;padding:9px 16px;border-radius:6px;border:0;background:var(--g);color:#fff;cursor:pointer;margin:4px}.ok.no{background:none;border:1px solid var(--r);color:var(--r)}.al{background:var(--rl);color:var(--r);border:1px solid var(--r);border-radius:6px;padding:8px 12px;margin:10px 0;font-weight:600}.dc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--r);border-radius:6px;padding:14px 16px;margin-bottom:12px}.dc h2{font:800 19px Bitter,serif;margin:0 0 6px}.dc .kv{margin:8px 0}.dc input,.dc select{width:100%}.gio{background:var(--rl);color:var(--r);border-radius:6px;padding:8px 10px;margin:8px 0}.mi{width:96px;text-align:right;padding:4px 6px;font-size:13px}.bb{height:10px;background:var(--g);border-radius:3px;min-width:2px}.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}.sc div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}.sc b{display:block;font:800 20px Bitter,serif}.neg{color:var(--r)}.note{font-size:13px;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;margin-top:12px}
button.sm{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--g);background:none;color:var(--g);border-radius:6px;cursor:pointer}

/* ===== iPhone / mobile ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.w{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.tw{-webkit-overflow-scrolling:touch}
input,select,textarea{-webkit-appearance:none;appearance:none;border-radius:8px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}

<script>
async function saveFile(name,data,type){
 try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data});return}}catch(e){}
 try{const f=new File([data],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.target='_blank';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);return}catch(e){}
 alert('Không tải được file trên trình duyệt này.');
}
</script>

function INT(d){return Math.floor(d)}
function jdFromDate(dd,mm,yy){var a=INT((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;var jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-INT(y/100)+INT(y/400)-32045;if(jd<2299161)jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-32083;return jd}
function jdToDate(jd){var a,b,c;if(jd>2299160){a=jd+32044;b=INT((4*a+3)/146097);c=a-INT(b*146097/4)}else{b=0;c=jd+32082}var d=INT((4*c+3)/1461),e=c-INT(1461*d/4),m=INT((5*e+2)/153);return[e-INT((153*m+2)/5)+1,m+3-12*INT(m/10),b*100+d-4800+INT(m/10)]}
function NewMoon(k){var T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;var Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;Jd1+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);var M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;var C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C1=C1-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);C1=C1-0.0004*Math.sin(dr*3*Mpr);C1=C1+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));C1=C1-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));C1=C1-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr));C1=C1+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));var dt=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;return Jd1+C1-dt}
function SunLongitude(jdn){var T=(jdn-2451545.0)/36525,T2=T*T,dr=Math.PI/180;var M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2;var DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);DL=DL+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);var L=(L0+DL)*dr;L=L-Math.PI*2*INT(L/(Math.PI*2));return L}
function sunL(d,tz){return INT(SunLongitude(d-0.5-tz/24)/Math.PI*6)}
function nmDay(k,tz){return INT(NewMoon(k)+0.5+tz/24)}
function m11(yy,tz){var off=jdFromDate(31,12,yy)-2415021,k=INT(off/29.530588853),nm=nmDay(k,tz);if(sunL(nm,tz)>=9)nm=nmDay(k-1,tz);return nm}
function leapOff(a11,tz){var k=INT((a11-2415021.076998695)/29.530588853+0.5),last=0,i=1,arc=sunL(nmDay(k+i,tz),tz);do{last=arc;i++;arc=sunL(nmDay(k+i,tz),tz)}while(arc!=last&&i<14);return i-1}
function s2l(dd,mm,yy,tz){var dn=jdFromDate(dd,mm,yy),k=INT((dn-2415021.076998695)/29.530588853),ms=nmDay(k+1,tz);if(ms>dn)ms=nmDay(k,tz);var a11=m11(yy,tz),b11=a11,ly;if(a11>=ms){ly=yy;a11=m11(yy-1,tz)}else{ly=yy+1;b11=m11(yy+1,tz)}var ld=dn-ms+1,diff=INT((ms-a11)/29),leap=0,lm=diff+11;if(b11-a11>365){var lo=leapOff(a11,tz);if(diff>=lo){lm=diff+10;if(diff==lo)leap=1}}if(lm>12)lm-=12;if(lm>=11&&diff<4)ly-=1;return[ld,lm,ly,leap]}
function l2s(ld,lm,ly,leap,tz){var a11,b11;if(lm<11){a11=m11(ly-1,tz);b11=m11(ly,tz)}else{a11=m11(ly,tz);b11=m11(ly+1,tz)}var k=INT(0.5+(a11-2415021.076998695)/29.530588853),off=lm-11;if(off<0)off+=12;if(b11-a11>365){var lo=leapOff(a11,tz),l2=lo-2;if(l2<0)l2+=12;if(leap!=0&&lm!=l2)return[0,0,0];else if(leap!=0||off>=lo)off+=1}return jdToDate(nmDay(k+off,tz)+ld-1)}

function drawE(){

 const [n26,s26]=tot('2026');
 const all=[...LG.map(x=>({d:x[0],t:x[1],a:x[2],adj:x[3]})),{d:'2026',t:'Thu Quỹ Khóa năm 2026: '+n26+' đồng chí (400k/500k)',a:s26},...qDocs];
 let cy='';const Y={};all.forEach(e=>{const m=String(e.d||'').match(/(20\d\d)/);if(m)cy=m[1];e.y=cy||'—';const o=Y[e.y]||(Y[e.y]={i:0,o:0});if(e.a>0&&!e.adj)o.i+=e.a;else if(e.a<0)o.o-=e.a});
 let bal=0,last='',adj=0,thu=0,chi=0;
 const rows=all.map(e=>{bal+=e.a;if(e.adj)adj+=e.a;else if(e.a>0)thu+=e.a;else chi-=e.a;let h='';if(e.y!=last){last=e.y;const o=Y[e.y];h=`<tr class="yh"><td colspan=6 style="background:var(--gl)"><b>Năm ${e.y}</b> · Thu ${fd(o.i)} · Chi ${fd(o.o)}</td></tr>`}
  return h+`<tr${e.adj?' style="background:var(--rl)"':''}><td>${eh(e.d)}</td><td style="white-space:normal">${eh(e.t)}</td><td class="n">${e.a>0?fd(e.a):''}</td><td class="n">${e.a<0?fd(-e.a):''}</td><td class="n ${bal<0?'neg':''}"><b>${bal<0?'−'+fd(-bal):fd(bal)}</b></td><td>${qOwner&&e.id?`<button class="sm" data-del="${e.id}">Xóa</button>`:''}</td></tr>`}).join('');
 const mx=Math.max(...YS.map(y=>tot(y)[1])),B=bal<0?'−'+fd(-bal):fd(bal);
 $('#e').innerHTML=`<div class="sc"><div><span>Quỹ Khóa (số dư hiện tại, tự cập nhật theo sổ)</span><b class="${bal<0?'neg':''}">${B}</b></div><div><span>Tổng thu từ đầu đến nay</span><b>${fd(thu)}</b></div><div><span>Tổng chi từ đầu đến nay</span><b>${fd(chi)}</b></div><div><span>Quỹ 2026 đã thu · ${n26} đc</span><b>${fd(s26)}</b></div><div><span>Chưa đóng quỹ 2026</span><b>${un.length} đc</b></div></div>
 <div class="det"><h2>Sổ thu – chi Quỹ Khóa</h2><div class="tw"><table class="hist" style="min-width:700px"><thead><tr><th>Ngày</th><th>Nội dung</th><th>Thu</th><th>Chi</th><th>Số dư</th><th></th></tr></thead><tbody>${rows}${qOwner?`<tr><td><input id="qd" placeholder="Ngày" style="width:100%"></td><td><input id="qt" placeholder="Nội dung thu/chi tiếp theo…" style="width:100%"></td><td><input id="qi" placeholder="Thu" style="width:100%"></td><td><input id="qo" placeholder="Chi" style="width:100%"></td><td colspan=2><button class="sm" id="qadd">Thêm dòng</button></td></tr>`:''}</tbody></table></div>

 <div class="det"><h2>Chưa đóng quỹ 2026 (${un.length})</h2><p>${un.map(m=>eh(m.name)+' (A'+m.a+')').join(' · ')||'Đã đóng đủ.'}</p></div>
